# Development stack - live code mounts + hot reload
services:
  # Embeddings only (nomic-embed-text)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local chat LLM - start with: docker compose --profile local-llm up -d
  ollama-llm:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11435:11434"
    volumes:
      - ollama_llm_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_LLM_HOST=http://ollama-llm:11434
    depends_on:
      chromadb:
        condition: service_started
      ollama:
        condition: service_healthy
    volumes:
      - ./data/raw:/app/data/raw
      - ./backend/src:/app/src
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  chroma_data:
  ollama_data:
  ollama_llm_data:
  frontend_node_modules:
