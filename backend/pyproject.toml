[tool.poetry]
package-mode = false

[project]
name = "witcher-ai-backend"
version = "0.1.0"
description = "Witcher 3 Wiki Assistant — RAG backend"
authors = [
    {name = "MBrosik",email = "michal.bros1@gmail.com"}
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.139.2,<0.140.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langchain-openai (>=1.4.1,<2.0.0)",
    "langchain-anthropic (>=1.5.1,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "mwclient (>=0.11.0,<0.12.0)",
    "mwparserfromhell (>=0.7.2,<0.8.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "langgraph (>=1.2.5,<1.3.0)",
    "voyageai (>=0.3.7,<1.0.0)",
]


[tool.ruff.lint]
ignore = ["BLE001"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.0,<0.17.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
